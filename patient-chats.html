<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>سُكُون · محادثاتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #f6faf9;
            --bg-secondary: #eef5f4;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --primary-50: #e6f3f3;
            --primary-100: #cce7e7;
            --primary-200: #99cfcf;
            --primary-300: #66b8b8;
            --primary-400: #3da0a0;
            --primary-500: #2a8888;
            --primary-600: #1f6f6f;
            --primary-700: #165656;
            --primary-800: #0d3d3d;
            --primary-900: #062424;
            
            --text-primary: #1a2e2e;
            --text-secondary: #3d5a5a;
            --text-tertiary: #6b8a8a;
            --text-on-primary: #ffffff;
            
            --danger: #e74c3c;
            --danger-light: rgba(231, 76, 60, 0.08);
            --success: #2ecc71;
            --warning: #f39c12;
            
            --shadow-xs: 0 2px 4px rgba(22, 86, 86, 0.04);
            --shadow-sm: 0 6px 16px rgba(22, 86, 86, 0.06);
            --shadow-md: 0 12px 28px rgba(22, 86, 86, 0.08);
            --shadow-lg: 0 20px 40px rgba(22, 86, 86, 0.12);
            --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.15);
            
            --radius-card: 24px;
            --radius-element: 16px;
            --radius-full: 9999px;
            
            --transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a1818;
                --bg-secondary: #0f2222;
                --surface: rgba(18, 30, 30, 0.85);
                --surface-solid: #142424;
                --text-primary: #e3f0f0;
                --text-secondary: #b3d1d1;
                --text-tertiary: #7aa3a3;
                --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.2);
                --shadow-sm: 0 6px 16px rgba(0, 0, 0, 0.25);
                --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
                --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.5);
                color-scheme: dark;
            }
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 95px;
            line-height: 1.5;
            position: relative;
            transition: background 0.2s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20vh;
            right: -10vw;
            width: 80vw;
            height: 80vw;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 136, 136, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.75rem 1.25rem;
            position: relative;
            z-index: 2;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .logo-main {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--primary-600);
            line-height: 1;
        }

        .logo-sub {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--primary-300);
            margin-right: 2px;
        }

        .page-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            border: 1.5px solid var(--primary-100);
            box-shadow: var(--shadow-xs);
        }

        /* مؤشر التحميل الأولي */
        .initial-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--primary-100);
            border-top-color: var(--primary-500);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--primary-100);
            border-radius: var(--radius-element);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            box-shadow: var(--shadow-xs);
            transition: var(--transition);
            cursor: pointer;
        }

        .stat-chip:hover {
            border-color: var(--primary-300);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .stat-chip.active {
            background: var(--primary-50);
            border-color: var(--primary-400);
            color: var(--primary-700);
        }

        .stat-number {
            background: var(--primary-500);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            height: 56px;
            padding: 0 52px 0 20px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--primary-100);
            border-radius: var(--radius-element);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-xs);
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary-400);
            background: var(--surface-solid);
            box-shadow: var(--shadow-focus);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
            width: 22px;
            height: 22px;
        }

        .clear-search {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-100);
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .clear-search.show {
            display: flex;
        }

        .clear-search:hover {
            background: var(--primary-200);
        }

        .chats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-wrapper {
            position: relative;
            animation: cardSlideIn 0.4s cubic-bezier(0.2, 0, 0, 1) forwards;
            opacity: 0;
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 1rem 1.2rem;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
            cursor: pointer;
            position: relative;
        }

        .chat-card.unread {
            border-right: 4px solid var(--primary-400);
        }

        .chat-card:hover {
            transform: translateX(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-200);
        }

        .chat-card:active {
            transform: scale(0.98);
        }

        .avatar-wrapper {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            box-shadow: var(--shadow-sm);
            border: 3px solid var(--surface-solid);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .chat-content {
            flex: 1;
            min-width: 0;
        }

        .chat-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .doctor-name {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .chat-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-time {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            white-space: nowrap;
        }

        .unread-badge {
            background: var(--primary-500);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 22px;
            text-align: center;
            display: none;
        }

        .chat-card.unread .unread-badge {
            display: inline-block;
        }

        .chat-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .last-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .mute-icon {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .options-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-tertiary);
            flex-shrink: 0;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }

        .options-btn:hover {
            background: var(--primary-50);
            border-color: var(--primary-200);
            color: var(--primary-600);
        }

        /* قائمة الخيارات */
        .options-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s;
        }

        .options-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .options-menu {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%) scale(0.9);
            background: var(--surface-solid);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid var(--primary-100);
            border-radius: 28px;
            box-shadow: var(--shadow-xl);
            padding: 12px;
            min-width: 300px;
            max-width: 90vw;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
        }

        .options-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 50%) scale(1);
        }

        .menu-header {
            padding: 12px 16px 8px;
            text-align: center;
            border-bottom: 1px solid var(--primary-100);
            margin-bottom: 8px;
        }

        .menu-doctor-name {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .menu-doctor-specialty {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: 1.5px solid transparent;
        }

        .menu-item:hover {
            background: var(--primary-50);
            border-color: var(--primary-100);
            color: var(--primary-700);
            transform: translateX(-4px);
        }

        .menu-item.danger {
            color: var(--danger);
        }

        .menu-item.danger:hover {
            background: var(--danger-light);
            border-color: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .menu-cancel {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: var(--primary-50);
            border: 1.5px solid var(--primary-100);
            border-radius: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-cancel:hover {
            background: var(--primary-100);
            border-color: var(--primary-200);
        }

        .empty-state {
            text-align: center;
            padding: 5rem 1.5rem;
            color: var(--text-tertiary);
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .empty-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .empty-subtitle {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .start-chat-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1.5rem;
            padding: 12px 28px;
            background: var(--primary-500);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .start-chat-btn:hover {
            background: var(--primary-600);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .sync-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            padding: 10px 20px;
            background: var(--surface);
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            border: 1.5px solid var(--primary-100);
            box-shadow: var(--shadow-xs);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sync-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary-400);
            transition: all 0.3s;
        }

        .sync-dot.syncing {
            background: var(--warning);
            animation: pulse 1.2s infinite;
        }

        .sync-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .confirm-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 30, 30, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .confirm-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        .confirm-dialog {
            background: var(--surface-solid);
            border-radius: var(--radius-card);
            border: 1.5px solid var(--primary-100);
            box-shadow: var(--shadow-xl);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        .confirm-backdrop.show .confirm-dialog {
            transform: scale(1) translateY(0);
        }

        .confirm-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .confirm-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .confirm-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .confirm-actions {
            display: flex;
            gap: 12px;
        }

        .confirm-btn {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirm-btn:active {
            transform: scale(0.95);
        }

        .confirm-btn.cancel {
            background: var(--primary-50);
            color: var(--text-secondary);
            border: 1.5px solid var(--primary-100);
        }

        .confirm-btn.cancel:hover {
            background: var(--primary-100);
        }

        .confirm-btn.confirm {
            background: var(--danger);
            color: white;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
        }

        .confirm-btn.confirm:hover {
            background: #c0392b;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary-800);
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 700;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            white-space: nowrap;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--success);
            box-shadow: 0 8px 24px rgba(46, 204, 113, 0.4);
        }

        .toast.error {
            background: var(--danger);
            box-shadow: 0 8px 24px rgba(231, 76, 60, 0.4);
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            padding: 10px 8px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 400;
        }

        .nav-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 18px;
            border-radius: 30px;
            color: var(--text-tertiary);
            font-weight: 700;
            font-size: 0.7rem;
            transition: var(--transition);
            position: relative;
        }

        .nav-link.active {
            color: var(--primary-600);
            background: var(--primary-50);
        }

        .nav-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 0.65rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .icon-sm {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 1.25rem 1rem;
            }
            .chat-card {
                padding: 0.9rem 1rem;
            }
            .avatar-wrapper {
                width: 52px;
                height: 52px;
            }
            .doctor-name {
                font-size: 0.95rem;
            }
            .options-menu {
                min-width: 280px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <span class="logo-main">سُ</span>
            <span class="logo-sub">كُون</span>
        </div>
        <div class="page-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>مشفّرة</span>
        </div>
    </header>

    <!-- شريط الإحصائيات -->
    <div class="stats-bar">
        <div class="stat-chip active" data-filter="all">
            <span>الكل</span>
            <span class="stat-number" id="totalCount">0</span>
        </div>
        <div class="stat-chip" data-filter="unread">
            <span>غير مقروء</span>
            <span class="stat-number" id="unreadCount">0</span>
        </div>
        <div class="stat-chip" data-filter="muted">
            <span>مكتوم</span>
            <span class="stat-number" id="mutedCount">0</span>
        </div>
    </div>

    <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الأخصائي..." autocomplete="off">
        <span class="search-icon">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </span>
        <button class="clear-search" id="clearSearch">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- مؤشر التحميل الأولي -->
    <div id="initialLoader" class="initial-loader">
        <div class="loader-spinner"></div>
        <p class="loader-text">جاري تحميل المحادثات...</p>
    </div>

    <div class="chats-list" id="chatsList" style="display: none;"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">💬</div>
        <div class="empty-title">مساحتك الهادئة</div>
        <div class="empty-subtitle">لا توجد محادثات حتى الآن.<br>ابدأ رحلتك مع أحد أخصائيينا.</div>
        <a href="patient-home.html" class="start-chat-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M12 5v14M5 12h14"></path>
            </svg>
            تصفح الأخصائيين
        </a>
    </div>

    <div class="sync-indicator" id="syncIndicator" style="display: none;">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncMessage"></span>
    </div>
</div>

<nav class="bottom-nav">
    <a href="patient-home.html" class="nav-link">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>الرئيسية</span>
    </a>
    <a href="patient-chats.html" class="nav-link active" style="position: relative;">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span>محادثاتي</span>
        <span class="nav-badge" id="navBadge" style="display: none;">0</span>
    </a>
    <a href="patient-agenda.html" class="nav-link">
        <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>الأجندة</span>
    </a>
    <a href="patient-tools.html" class="nav-link">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M2 12h6M22 12h-6M12 2v6M12 22v-6M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M14.83 9.17l3.53-3.53M4.93 19.07l4.24-4.24"></path>
        </svg>
        <span>أدوات</span>
    </a>
</nav>

<!-- خلفية القائمة المنبثقة -->
<div class="options-overlay" id="optionsOverlay"></div>

<!-- قائمة الخيارات المنبثقة -->
<div class="options-menu" id="optionsMenu">
    <div class="menu-header">
        <div class="menu-doctor-name" id="menuDoctorName"></div>
        <div class="menu-doctor-specialty" id="menuDoctorSpecialty"></div>
    </div>
    <div class="menu-item" data-action="mute" id="menuMuteItem">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span id="menuMuteText">كتم الإشعارات</span>
    </div>
    <div class="menu-item" data-action="archive">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="21 8 21 21 3 21 3 8"></polyline>
            <rect x="1" y="3" width="22" height="5"></rect>
            <line x1="10" y1="12" x2="14" y2="12"></line>
        </svg>
        <span>أرشفة المحادثة</span>
    </div>
    <div class="menu-item danger" data-action="delete">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>حذف المحادثة</span>
    </div>
    <button class="menu-cancel" id="menuCancel">إلغاء</button>
</div>

<!-- حوار التأكيد -->
<div class="confirm-backdrop" id="confirmBackdrop">
    <div class="confirm-dialog">
        <span class="confirm-icon" id="confirmIcon">🗑️</span>
        <div class="confirm-title" id="confirmTitle"></div>
        <div class="confirm-message" id="confirmMsg"></div>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" id="confirmCancel">إلغاء</button>
            <button class="confirm-btn confirm" id="confirmOk">تأكيد</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module">
    import { firebaseConfig } from './firebase-config.js';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // ==================== عناصر DOM ====================
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const elements = {
        initialLoader: $('#initialLoader'),
        chatsList: $('#chatsList'),
        emptyState: $('#emptyState'),
        searchInput: $('#searchInput'),
        clearSearch: $('#clearSearch'),
        totalCount: $('#totalCount'),
        unreadCount: $('#unreadCount'),
        mutedCount: $('#mutedCount'),
        syncIndicator: $('#syncIndicator'),
        syncDot: $('#syncDot'),
        syncMessage: $('#syncMessage'),
        optionsOverlay: $('#optionsOverlay'),
        optionsMenu: $('#optionsMenu'),
        menuDoctorName: $('#menuDoctorName'),
        menuDoctorSpecialty: $('#menuDoctorSpecialty'),
        menuMuteText: $('#menuMuteText'),
        navBadge: $('#navBadge'),
        toast: $('#toast'),
        confirmBackdrop: $('#confirmBackdrop'),
        confirmIcon: $('#confirmIcon'),
        confirmTitle: $('#confirmTitle'),
        confirmMsg: $('#confirmMsg'),
        confirmCancel: $('#confirmCancel'),
        confirmOk: $('#confirmOk')
    };

    // ==================== التخزين المحلي ====================
    const STORAGE = {
        CONVERSATIONS: (uid) => `sc_conv_${uid}`,
        DOCTORS: (docId) => `sc_doc_${docId}`,
        MUTED: (uid) => `sc_muted_${uid}`
    };

    class LocalCache {
        static saveConversations(uid, conversations) {
            try {
                const data = conversations.map(c => ({
                    i: c.id,
                    d: c.doctorId,
                    n: c.doctorName || '',
                    a: c.doctorAvatar || '',
                    s: c.specialty || '',
                    m: c.lastMessage?.substring(0, 100) || '',
                    t: c.lastMessageTime || Date.now(),
                    u: c.unread || false,
                    k: c.muted || false,
                    uc: c.unreadCount || 1
                }));
                localStorage.setItem(STORAGE.CONVERSATIONS(uid), JSON.stringify(data));
            } catch (e) {
                localStorage.removeItem(STORAGE.CONVERSATIONS(uid));
            }
        }

        static loadConversations(uid) {
            try {
                const raw = localStorage.getItem(STORAGE.CONVERSATIONS(uid));
                if (!raw) return null;
                const data = JSON.parse(raw);
                return data.map(c => ({
                    id: c.i,
                    doctorId: c.d,
                    doctorName: c.n || '',
                    doctorAvatar: c.a || '',
                    specialty: c.s || '',
                    lastMessage: c.m || '',
                    lastMessageTime: c.t || Date.now(),
                    unread: c.u || false,
                    muted: c.k || false,
                    unreadCount: c.uc || 1
                }));
            } catch {
                return null;
            }
        }

        static saveDoctor(docId, data) {
            try {
                localStorage.setItem(STORAGE.DOCTORS(docId), JSON.stringify({
                    n: data.name || '',
                    p: data.photoURL || '',
                    s: data.specialty || ''
                }));
            } catch {}
        }

        static getDoctor(docId) {
            try {
                const raw = localStorage.getItem(STORAGE.DOCTORS(docId));
                return raw ? JSON.parse(raw) : null;
            } catch {
                return null;
            }
        }

        static saveMuted(uid, mutedSet) {
            try {
                localStorage.setItem(STORAGE.MUTED(uid), JSON.stringify([...mutedSet]));
            } catch {}
        }

        static loadMuted(uid) {
            try {
                const raw = localStorage.getItem(STORAGE.MUTED(uid));
                return raw ? new Set(JSON.parse(raw)) : new Set();
            } catch {
                return new Set();
            }
        }
    }

    // ==================== الحالة ====================
    let currentUser = null;
    let conversations = [];
    let activeFilter = 'all';
    let searchQuery = '';
    let currentMenuConvId = null;
    let mutedSet = new Set();
    let isFirstLoad = true;

    // ==================== الأدوات المساعدة ====================
    const toast = (message, type = '') => {
        const el = elements.toast;
        el.textContent = message;
        el.className = `toast show ${type}`;
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
    };

    const formatTime = (timestamp) => {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        
        if (diff < 60) return 'الآن';
        if (diff < 3600) return `${Math.floor(diff / 60)} د`;
        if (diff < 86400) return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        if (diff < 172800) return 'أمس';
        return date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
    };

    const escapeHtml = (str) => {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
    };

    const setSyncStatus = (status, message) => {
        elements.syncDot.className = `sync-dot ${status}`;
        elements.syncMessage.textContent = message;
        if (elements.syncIndicator.style.display === 'none') {
            elements.syncIndicator.style.display = 'inline-flex';
        }
    };

    const showConfirm = ({ icon, title, message, onConfirm }) => {
        elements.confirmIcon.textContent = icon || '⚠️';
        elements.confirmTitle.textContent = title || '';
        elements.confirmMsg.textContent = message || '';
        
        elements.confirmBackdrop.classList.add('show');
        
        const close = () => elements.confirmBackdrop.classList.remove('show');
        
        elements.confirmCancel.onclick = close;
        elements.confirmOk.onclick = () => {
            close();
            onConfirm?.();
        };
        
        elements.confirmBackdrop.onclick = (e) => {
            if (e.target === elements.confirmBackdrop) close();
        };
    };

    const hideInitialLoader = () => {
        if (isFirstLoad) {
            elements.initialLoader.style.display = 'none';
            elements.chatsList.style.display = 'flex';
            isFirstLoad = false;
        }
    };

    // ==================== عرض القائمة المنبثقة ====================
    const showOptionsMenu = (convId) => {
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        
        currentMenuConvId = convId;
        
        elements.menuDoctorName.textContent = conv.doctorName || 'أخصائي';
        elements.menuDoctorSpecialty.textContent = conv.specialty || 'معالج نفسي';
        
        if (conv.muted) {
            elements.menuMuteText.textContent = 'إلغاء الكتم';
        } else {
            elements.menuMuteText.textContent = 'كتم الإشعارات';
        }
        
        elements.optionsOverlay.classList.add('show');
        elements.optionsMenu.classList.add('show');
    };

    const hideOptionsMenu = () => {
        elements.optionsOverlay.classList.remove('show');
        elements.optionsMenu.classList.remove('show');
        currentMenuConvId = null;
    };

    // ==================== إجراءات المحادثة ====================
    const toggleMute = async (convId) => {
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        
        conv.muted = !conv.muted;
        
        if (conv.muted) {
            mutedSet.add(convId);
        } else {
            mutedSet.delete(convId);
        }
        
        LocalCache.saveMuted(currentUser.uid, mutedSet);
        LocalCache.saveConversations(currentUser.uid, conversations);
        
        toast(conv.muted ? '🔕 تم كتم الإشعارات' : '🔔 تم إلغاء الكتم', 'success');
        renderConversations();
        hideOptionsMenu();
    };

    const archiveConversation = async (convId) => {
        try {
            await update(ref(database, `conversations/${convId}`), {
                archived: true,
                archivedAt: Date.now()
            });
            
            conversations = conversations.filter(c => c.id !== convId);
            LocalCache.saveConversations(currentUser.uid, conversations);
            
            toast('📦 تمت الأرشفة', 'success');
            renderConversations();
            hideOptionsMenu();
        } catch (error) {
            toast('حدث خطأ في الأرشفة', 'error');
        }
    };

    const deleteConversation = async (convId) => {
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        
        showConfirm({
            icon: '🗑️',
            title: 'حذف المحادثة',
            message: `هل أنت متأكد من حذف المحادثة مع ${conv.doctorName || 'الأخصائي'}؟\nلا يمكن التراجع عن هذا الإجراء.`,
            onConfirm: async () => {
                try {
                    await remove(ref(database, `conversations/${convId}`));
                    conversations = conversations.filter(c => c.id !== convId);
                    LocalCache.saveConversations(currentUser.uid, conversations);
                    toast('تم حذف المحادثة', 'success');
                    renderConversations();
                } catch (error) {
                    toast('فشل في حذف المحادثة', 'error');
                }
            }
        });
        
        hideOptionsMenu();
    };

    // ==================== جلب بيانات الطبيب ====================
    const fetchDoctorData = async (doctorId) => {
        // محاولة من الذاكرة المحلية أولاً
        let cached = LocalCache.getDoctor(doctorId);
        if (cached) return { name: cached.n, photoURL: cached.p, specialty: cached.s };
        
        try {
            const snapshot = await get(ref(database, `doctors/${doctorId}`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                const doctor = {
                    name: data.name || 'أخصائي',
                    photoURL: data.photoURL || '',
                    specialty: data.specialty || ''
                };
                LocalCache.saveDoctor(doctorId, doctor);
                return doctor;
            }
        } catch (error) {
            console.warn('فشل جلب بيانات الطبيب:', error);
        }
        
        return { name: 'أخصائي', photoURL: '', specialty: '' };
    };

    // ==================== عرض المحادثات ====================
    const getFilteredConversations = () => {
        let filtered = [...conversations];
        
        if (activeFilter === 'unread') {
            filtered = filtered.filter(c => c.unread);
        } else if (activeFilter === 'muted') {
            filtered = filtered.filter(c => c.muted);
        }
        
        if (searchQuery) {
            const query = searchQuery.toLowerCase();
            filtered = filtered.filter(c => 
                (c.doctorName || '').toLowerCase().includes(query) ||
                (c.lastMessage || '').toLowerCase().includes(query) ||
                (c.specialty || '').toLowerCase().includes(query)
            );
        }
        
        return filtered;
    };

    const updateStats = () => {
        const total = conversations.length;
        const unread = conversations.filter(c => c.unread).length;
        const muted = conversations.filter(c => c.muted).length;
        
        elements.totalCount.textContent = total;
        elements.unreadCount.textContent = unread;
        elements.mutedCount.textContent = muted;
        
        if (unread > 0) {
            elements.navBadge.style.display = 'flex';
            elements.navBadge.textContent = unread > 99 ? '99+' : unread;
        } else {
            elements.navBadge.style.display = 'none';
        }
    };

    const renderConversations = () => {
        hideInitialLoader();
        
        const filtered = getFilteredConversations();
        
        if (filtered.length === 0) {
            elements.chatsList.innerHTML = '';
            elements.chatsList.style.display = 'none';
            elements.emptyState.style.display = 'block';
            updateStats();
            return;
        }
        
        elements.emptyState.style.display = 'none';
        elements.chatsList.style.display = 'flex';
        
        const fragment = document.createDocumentFragment();
        
        filtered.forEach((conv, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'chat-wrapper';
            wrapper.style.animationDelay = `${index * 0.05}s`;
            
            const card = document.createElement('div');
            card.className = `chat-card${conv.unread ? ' unread' : ''}`;
            card.dataset.convId = conv.id;
            
            const avatarContent = conv.doctorAvatar 
                ? `<img src="${escapeHtml(conv.doctorAvatar)}" alt="" class="avatar-img" loading="lazy">`
                : (conv.doctorName || 'د').charAt(0).toUpperCase();
            
            card.innerHTML = `
                <div class="avatar-wrapper">
                    ${avatarContent}
                </div>
                <div class="chat-content">
                    <div class="chat-header">
                        <span class="doctor-name">${escapeHtml(conv.doctorName || 'أخصائي')}</span>
                        <div class="chat-meta">
                            <span class="chat-time">${formatTime(conv.lastMessageTime)}</span>
                            <span class="unread-badge">${conv.unreadCount || 1}</span>
                        </div>
                    </div>
                    <div class="chat-preview">
                        <span class="last-message">
                            ${conv.muted ? '<span class="mute-icon">🔕</span> ' : ''}
                            ${escapeHtml(conv.lastMessage || 'ابدأ المحادثة...')}
                        </span>
                    </div>
                </div>
                <button class="options-btn" data-conv-id="${conv.id}" aria-label="خيارات">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="5" r="1.5"/>
                        <circle cx="12" cy="12" r="1.5"/>
                        <circle cx="12" cy="19" r="1.5"/>
                    </svg>
                </button>
            `;
            
            // النقر على البطاقة للذهاب للمحادثة
            card.addEventListener('click', (e) => {
                if (e.target.closest('.options-btn')) return;
                
                if (conv.unread) {
                    conv.unread = false;
                    LocalCache.saveConversations(currentUser.uid, conversations);
                }
                
                window.location.href = `conversation.html?doctorId=${encodeURIComponent(conv.doctorId)}&convId=${encodeURIComponent(conv.id)}`;
            });
            
            // زر الخيارات
            const optionsBtn = card.querySelector('.options-btn');
            optionsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showOptionsMenu(conv.id);
            });
            
            wrapper.appendChild(card);
            fragment.appendChild(wrapper);
        });
        
        elements.chatsList.innerHTML = '';
        elements.chatsList.appendChild(fragment);
        updateStats();
    };

    // ==================== المزامنة مع Firebase ====================
    const startRealtimeSync = () => {
        if (!currentUser) return;
        
        setSyncStatus('syncing', 'جاري المزامنة...');
        
        const conversationsRef = ref(database, 'conversations');
        
        onValue(conversationsRef, async (snapshot) => {
            const freshConversations = [];
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                for (const convId in data) {
                    const conv = data[convId];
                    
                    // التحقق من أن المحادثة تخص المستخدم الحالي
                    if (conv.patientId !== currentUser.uid) continue;
                    
                    // تجاهل المحادثات المؤرشفة
                    if (conv.archived) continue;
                    
                    const doctor = await fetchDoctorData(conv.doctorId);
                    
                    freshConversations.push({
                        id: convId,
                        doctorId: conv.doctorId,
                        doctorName: doctor.name,
                        doctorAvatar: doctor.photoURL,
                        specialty: doctor.specialty,
                        lastMessage: conv.lastMessage || '',
                        lastMessageTime: conv.lastMessageTime || conv.createdAt || Date.now(),
                        unread: conv.unreadPatient || false,
                        unreadCount: conv.unreadCount || 1,
                        muted: mutedSet.has(convId)
                    });
                }
            }
            
            // ترتيب حسب الأحدث
            freshConversations.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
            
            conversations = freshConversations;
            LocalCache.saveConversations(currentUser.uid, conversations);
            
            renderConversations();
            setSyncStatus('online', 'محدثة ✅');
            
        }, (error) => {
            console.warn('خطأ في المزامنة:', error);
            setSyncStatus('syncing', 'غير متصل - عرض المحلي');
            
            // إذا فشل الاتصال، نعرض البيانات المخزنة
            if (isFirstLoad) {
                const cached = LocalCache.loadConversations(currentUser.uid);
                if (cached && cached.length > 0) {
                    conversations = cached;
                    conversations.forEach(c => {
                        if (mutedSet.has(c.id)) c.muted = true;
                    });
                    renderConversations();
                }
            }
        });
    };

    // ==================== إعداد الأحداث ====================
    const setupEventListeners = () => {
        // البحث
        elements.searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            elements.clearSearch.classList.toggle('show', searchQuery.length > 0);
            renderConversations();
        });
        
        elements.clearSearch.addEventListener('click', () => {
            elements.searchInput.value = '';
            searchQuery = '';
            elements.clearSearch.classList.remove('show');
            elements.searchInput.focus();
            renderConversations();
        });
        
        // فلترة الإحصائيات
        $$('.stat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                $$('.stat-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeFilter = chip.dataset.filter;
                renderConversations();
            });
        });
        
        // قائمة الخيارات
        elements.optionsOverlay.addEventListener('click', hideOptionsMenu);
        $('#menuCancel').addEventListener('click', hideOptionsMenu);
        
        // أزرار القائمة
        elements.optionsMenu.addEventListener('click', (e) => {
            const menuItem = e.target.closest('.menu-item');
            if (!menuItem) return;
            
            const action = menuItem.dataset.action;
            
            switch(action) {
                case 'mute':
                    toggleMute(currentMenuConvId);
                    break;
                case 'archive':
                    archiveConversation(currentMenuConvId);
                    break;
                case 'delete':
                    deleteConversation(currentMenuConvId);
                    break;
            }
        });
        
        // إغلاق القائمة بمفتاح Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideOptionsMenu();
        });
    };

    // ==================== بدء التطبيق ====================
    const initializeApp = async (user) => {
        currentUser = user;
        
        // تحميل الإعدادات المحفوظة
        mutedSet = LocalCache.loadMuted(user.uid);
        
        // ⚡ تحميل سريع من الذاكرة المحلية أولاً
        const cached = LocalCache.loadConversations(user.uid);
        if (cached && cached.length > 0) {
            conversations = cached;
            conversations.forEach(c => {
                if (mutedSet.has(c.id)) c.muted = true;
            });
            renderConversations();
            setSyncStatus('online', 'من الذاكرة المحلية');
        }
        
        // بدء المستمعين والمزامنة
        setupEventListeners();
        startRealtimeSync();
    };

    // ==================== المصادقة ====================
    onAuthStateChanged(auth, (user) => {
        if (user) {
            initializeApp(user);
        } else {
            // إذا لم يكن هناك مستخدم، نعرض loader مؤقتاً ثم نوجه
            setTimeout(() => {
                window.location.href = 'patient-login.html';
            }, 500);
        }
    });

    // دعم المتصفحات القديمة
    if (!CSS.supports('backdrop-filter', 'blur(10px)')) {
        document.documentElement.style.setProperty('--surface', 'rgba(255, 255, 255, 0.98)');
    }
</script>

<script type="module" src="patient-call-listener.js"></script>
</body>
</html>
