<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>سُكُون | رحلة العناية النفسية</title>

    <!-- تحميل الخط مع استراتيجية العرض الفوري -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== نفس التصميم السابق مع إضافات ==================== */
        :root {
            --bg-primary: #f6faf9;
            --bg-secondary: #eef5f4;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-solid: #ffffff;
            --primary-50: #e6f3f3;
            --primary-100: #cce7e7;
            --primary-200: #99cfcf;
            --primary-300: #66b8b8;
            --primary-400: #3da0a0;
            --primary-500: #2a8888;
            --primary-600: #1f6f6f;
            --primary-700: #165656;
            --primary-800: #0d3d3d;
            --primary-900: #062424;
            --heart-color: #e74c3c;
            --star-color: #f39c12;
            
            --text-primary: #1a2e2e;
            --text-secondary: #3d5a5a;
            --text-tertiary: #6b8a8a;
            --text-on-primary: #ffffff;
            
            --shadow-xs: 0 2px 4px rgba(22, 86, 86, 0.04);
            --shadow-sm: 0 6px 16px rgba(22, 86, 86, 0.06);
            --shadow-md: 0 12px 28px rgba(22, 86, 86, 0.08);
            --shadow-lg: 0 20px 40px rgba(22, 86, 86, 0.12);
            --shadow-focus: 0 0 0 3px rgba(42, 136, 136, 0.15);
            
            --radius-card: 28px;
            --radius-element: 18px;
            --radius-full: 9999px;
            
            --transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a1818;
                --bg-secondary: #0f2222;
                --surface: rgba(18, 30, 30, 0.85);
                --surface-solid: #142424;
                --text-primary: #e3f0f0;
                --text-secondary: #b3d1d1;
                --text-tertiary: #7aa3a3;
                --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.2);
                --shadow-sm: 0 6px 16px rgba(0, 0, 0, 0.25);
                --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.3);
                --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
                color-scheme: dark;
            }
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 95px;
            line-height: 1.5;
            position: relative;
            transition: background 0.2s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20vh;
            right: -10vw;
            width: 80vw;
            height: 80vw;
            max-width: 600px;
            max-height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 136, 136, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.75rem 1.25rem;
            position: relative;
            z-index: 2;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .logo-main {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--primary-600);
            line-height: 1;
        }

        .logo-sub {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--primary-300);
            margin-right: 2px;
        }

        .header-wave {
            width: 80px;
            height: 24px;
            opacity: 0.4;
            color: var(--primary-200);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        .search-input {
            width: 100%;
            height: 56px;
            padding: 0 48px 0 20px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--primary-100);
            border-radius: var(--radius-element);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-xs);
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary-400);
            background: var(--surface-solid);
            box-shadow: var(--shadow-focus);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
            width: 20px;
            height: 20px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 56px;
            padding: 0 20px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid var(--primary-100);
            border-radius: var(--radius-element);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            box-shadow: var(--shadow-xs);
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-btn:hover {
            border-color: var(--primary-300);
            background: var(--surface-solid);
        }

        .filter-btn.active {
            border-color: var(--primary-400);
            background: var(--primary-50);
        }

        .filter-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            background: var(--surface-solid);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--primary-100);
            padding: 8px;
            min-width: 240px;
            z-index: 100;
            display: none;
            transform-origin: top left;
            animation: dropdownFade 0.18s ease;
        }

        @keyframes dropdownFade {
            from { opacity: 0; transform: scale(0.95) translateY(-8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .filter-dropdown.show {
            display: block;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s;
        }

        .filter-option:hover {
            background: var(--primary-50);
            color: var(--primary-700);
        }

        .filter-option.active {
            background: var(--primary-500);
            color: white;
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .doctor-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        @media (prefers-reduced-motion: no-preference) {
            .doctor-card:active {
                transform: scale(0.985);
                box-shadow: var(--shadow-md);
            }
        }

        .card-header {
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .avatar-wrapper {
            width: 96px;
            height: 96px;
            flex-shrink: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
            box-shadow: var(--shadow-md);
            border: 3px solid var(--surface-solid);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .doctor-info {
            flex: 1;
            min-width: 0;
        }

        .doctor-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .specialty-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-50);
            color: var(--primary-700);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid var(--primary-100);
            margin-bottom: 8px;
        }

        .doctor-bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ========== نظام التفاعلات الجديد ========== */
        .interactions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px solid var(--primary-100);
            border-bottom: 1px solid var(--primary-100);
        }

        .heart-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 2px solid var(--primary-100);
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        .heart-btn:hover {
            border-color: var(--heart-color);
            background: rgba(231, 76, 60, 0.05);
        }

        .heart-btn.liked {
            border-color: var(--heart-color);
            background: rgba(231, 76, 60, 0.1);
            color: var(--heart-color);
        }

        .heart-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .heart-btn.liked .heart-icon {
            fill: var(--heart-color);
            stroke: var(--heart-color);
            animation: heartPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .likes-count {
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        /* النجوم والتقييم */
        .rating-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stars-container {
            display: flex;
            gap: 2px;
        }

        .star {
            width: 20px;
            height: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .star.filled {
            fill: var(--star-color);
            stroke: var(--star-color);
        }

        .star.empty {
            fill: none;
            stroke: var(--text-tertiary);
        }

        .rating-number {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .rating-count {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        /* التعليقات كتقييمات */
        .reviews-section {
            margin-top: 8px;
        }

        .reviews-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .reviews-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .add-review-btn {
            padding: 6px 14px;
            background: var(--primary-50);
            border: 1px solid var(--primary-200);
            border-radius: 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--primary-700);
            cursor: pointer;
            transition: var(--transition);
        }

        .add-review-btn:hover {
            background: var(--primary-100);
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .review-item {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 12px;
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .reviewer-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-400), var(--primary-600));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .reviewer-name {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .review-date {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            margin-right: auto;
        }

        .review-rating {
            display: flex;
            gap: 2px;
            margin-bottom: 4px;
        }

        .review-star {
            width: 14px;
            height: 14px;
        }

        .review-star.filled {
            fill: var(--star-color);
            stroke: var(--star-color);
        }

        .review-star.empty {
            fill: none;
            stroke: var(--text-tertiary);
        }

        .review-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .review-form {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: var(--surface-solid);
            border-radius: 16px;
            border: 1px solid var(--primary-100);
        }

        .review-form.show {
            display: block;
        }

        .review-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--primary-100);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--text-primary);
            resize: vertical;
            margin-bottom: 8px;
        }

        .review-submit {
            padding: 8px 20px;
            background: var(--primary-500);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
        }

        .star-rating-input {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }

        .star-rating-input .star {
            width: 28px;
            height: 28px;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(145deg, var(--primary-600), var(--primary-500));
            color: white;
            border: none;
            border-radius: 18px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(42, 136, 136, 0.25);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .action-button:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(42, 136, 136, 0.3);
        }

        .skeleton-card {
            background: var(--surface);
            border-radius: var(--radius-card);
            padding: 1.5rem;
            display: flex;
            gap: 1.2rem;
            border: 1.5px solid var(--primary-100);
        }

        .skeleton-avatar {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: var(--primary-100);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .skeleton-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 8px;
        }

        .skeleton-line {
            height: 16px;
            background: var(--primary-100);
            border-radius: 20px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.9; }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-tertiary);
            display: none;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }

        .sync-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            padding: 8px 16px;
            background: var(--surface);
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid var(--primary-100);
            box-shadow: var(--shadow-xs);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-400);
            transition: background 0.2s;
        }

        .sync-dot.syncing {
            background: #f4b740;
            animation: blink 1.2s infinite;
        }

        .sync-dot.online {
            background: #2ecc71;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 500px;
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            padding: 10px 8px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 500;
        }

        .nav-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 18px;
            border-radius: 30px;
            color: var(--text-tertiary);
            font-weight: 600;
            font-size: 0.7rem;
            transition: var(--transition);
        }

        .nav-link.active {
            color: var(--primary-600);
            background: var(--primary-50);
        }

        .icon {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .icon-sm {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 1.25rem 1rem;
            }
            .doctor-card {
                padding: 1.2rem;
            }
            .avatar-wrapper {
                width: 80px;
                height: 80px;
                border-radius: 20px;
            }
            .doctor-name {
                font-size: 1.1rem;
            }
            .interactions-bar {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo">
            <span class="logo-main">سُ</span>
            <span class="logo-sub">كُون</span>
        </div>
        <svg class="header-wave" viewBox="0 0 100 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 10 Q 25 0, 50 10 T 100 10" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
    </header>

    <div class="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الأخصائي..." autocomplete="off" aria-label="بحث">
            <span class="search-icon">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
        </div>

        <div style="position: relative;">
            <button class="filter-btn" id="filterBtn">
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
                <span id="filterLabel">كل التخصصات</span>
                <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="filter-dropdown" id="filterDropdown"></div>
        </div>
    </div>

    <div class="cards-grid" id="cardsGrid">
        <!-- Skeletons will be replaced by real content -->
    </div>

    <div class="empty-state" id="emptyState">
        <div class="empty-icon">🍃</div>

<script type="module">
    // ==================== استيراد الإعدادات من ملف خارجي ====================
    import { firebaseConfig } from './firebase-config.js';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { 
        getDatabase, 
        ref, 
        onValue, 
        set, 
        update, 
        remove, 
        get,
        push,
        query,
        orderByChild,
        limitToLast,
        runTransaction
    } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // ==================== إدارة التخزين المحلي باستخدام IndexedDB ====================
    class DoctorCache {
        constructor() {
            this.db = null;
        }
        async init() {
            if (this.db) return;
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SakoonDoctorCache', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    this.db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('doctors')) {
                        db.createObjectStore('doctors', { keyPath: 'i' });
                    }
                    if (!db.objectStoreNames.contains('metadata')) {
                        db.createObjectStore('metadata', { keyPath: 'key' });
                    }
                };
            });
        }
        async save(doctors) {
            await this.init();
            const compact = doctors.map(d => ({
                i: d.id,
                u: d.authUid || d.id,
                n: d.name || '',
                s: d.specialty || '',
                b: (d.quickBlurb || '').substring(0, 100),
                p: d.photoURL || ''
            }));
            return new Promise((resolve, reject) => {
                const tx = this.db.transaction(['doctors', 'metadata'], 'readwrite');
                const doctorStore = tx.objectStore('doctors');
                const metaStore = tx.objectStore('metadata');
                
                doctorStore.clear();
                compact.forEach(doc => doctorStore.put(doc));
                metaStore.put({ key: 'lastSync', value: Date.now() });
                
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }
        async load() {
            await this.init();
            return new Promise((resolve, reject) => {
                const tx = this.db.transaction('doctors', 'readonly');
                const store = tx.objectStore('doctors');
                const request = store.getAll();
                request.onsuccess = () => {
                    const compact = request.result || [];
                    const doctors = compact.map(d => ({
                        id: d.i,
                        authUid: d.u,
                        name: d.n,
                        specialty: d.s,
                        quickBlurb: d.b,
                        photoURL: d.p
                    }));
                    resolve(doctors);
                };
                request.onerror = () => reject(request.error);
            });
        }
        async getLastSync() {
            await this.init();
            return new Promise((resolve, reject) => {
                const tx = this.db.transaction('metadata', 'readonly');
                const store = tx.objectStore('metadata');
                const request = store.get('lastSync');
                request.onsuccess = () => resolve(request.result?.value || 0);
                request.onerror = () => reject(request.error);
            });
        }
    }

    const cache = new DoctorCache();

    // ==================== الدوال المساعدة ====================
    const specialtyLabels = {
        'psychiatrist': 'طبيب نفسي',
        'psychologist': 'أخصائي نفسي',
        'family_counselor': 'استشاري أسري',
        'child_psychology': 'علم نفس الأطفال',
        'addiction_counselor': 'استشاري إدمان',
        'cbt': 'معالج سلوكي معرفي',
        'trauma_therapist': 'معالج صدمات'
    };
    const getSpecialtyName = (key) => specialtyLabels[key] || key || 'معالج';

    // عناصر DOM
    const grid = document.getElementById('cardsGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const filterBtn = document.getElementById('filterBtn');
    const filterDropdown = document.getElementById('filterDropdown');
    const filterLabel = document.getElementById('filterLabel');
    const syncDot = document.getElementById('syncDot');
    const syncMessage = document.getElementById('syncMessage');

    let allDoctors = [];
    let filterSpecialty = 'all';
    let searchQuery = '';
    let currentUser = null;
    let userLikes = new Set(); // تخزين إعجابات المستخدم الحالي
    let userRatings = {}; // تخزين تقييمات المستخدم الحالي

    // ضبط مؤشر المزامنة
    function setSyncStatus(status, msg) {
        syncDot.className = 'sync-dot';
        if (status === 'syncing') syncDot.classList.add('syncing');
        else if (status === 'online') syncDot.classList.add('online');
        syncMessage.textContent = msg;
    }

    // ==================== نظام الإعجابات ====================
    async function toggleLike(doctorId) {
        if (!currentUser) return;
        
        const likeRef = ref(database, `likes/${doctorId}/${currentUser.uid}`);
        const likeCountRef = ref(database, `likeCounts/${doctorId}`);
        
        try {
            const snapshot = await get(likeRef);
            
            if (snapshot.exists()) {
                // إلغاء الإعجاب
                await remove(likeRef);
                await runTransaction(likeCountRef, (count) => (count || 1) - 1);
                userLikes.delete(doctorId);
            } else {
                // إضافة إعجاب
                await set(likeRef, {
                    userId: currentUser.uid,
                    timestamp: Date.now()
                });
                await runTransaction(likeCountRef, (count) => (count || 0) + 1);
                userLikes.add(doctorId);
            }
            
            // تحديث واجهة المستخدم
            updateDoctorCardUI(doctorId);
        } catch (error) {
            console.error('خطأ في تحديث الإعجاب:', error);
        }
    }

    async function loadLikesData(doctorId) {
        if (!currentUser) return { liked: false, count: 0 };
        
        const likeRef = ref(database, `likes/${doctorId}/${currentUser.uid}`);
        const likeCountRef = ref(database, `likeCounts/${doctorId}`);
        
        try {
            const [likeSnapshot, countSnapshot] = await Promise.all([
                get(likeRef),
                get(likeCountRef)
            ]);
            
            const liked = likeSnapshot.exists();
            const count = countSnapshot.val() || 0;
            
            if (liked) userLikes.add(doctorId);
            
            return { liked, count };
        } catch (error) {
            console.error('خطأ في تحميل الإعجابات:', error);
            return { liked: false, count: 0 };
        }
    }

    // ==================== نظام التقييمات والمراجعات ====================
    async function submitRating(doctorId, rating, reviewText = '') {
        if (!currentUser) return;
        
        const ratingRef = ref(database, `ratings/${doctorId}/${currentUser.uid}`);
        
        try {
            await set(ratingRef, {
                userId: currentUser.uid,
                userName: currentUser.displayName || 'مستخدم',
                rating: rating,
                review: reviewText,
                timestamp: Date.now()
            });
            
            userRatings[doctorId] = { rating, review: reviewText };
            await updateDoctorAverageRating(doctorId);
            updateDoctorCardUI(doctorId);
            
            return true;
        } catch (error) {
            console.error('خطأ في إرسال التقييم:', error);
            return false;
        }
    }

    async function updateDoctorAverageRating(doctorId) {
        const ratingsRef = ref(database, `ratings/${doctorId}`);
        const avgRef = ref(database, `doctorStats/${doctorId}/averageRating`);
        
        try {
            const snapshot = await get(ratingsRef);
            if (!snapshot.exists()) {
                await set(avgRef, 0);
                return;
            }
            
            const ratings = [];
            snapshot.forEach(child => {
                ratings.push(child.val().rating);
            });
            
            const average = ratings.reduce((a, b) => a + b, 0) / ratings.length;
            await set(avgRef, Math.round(average * 10) / 10);
        } catch (error) {
            console.error('خطأ في تحديث متوسط التقييم:', error);
        }
    }

    async function loadRatingsData(doctorId) {
        const ratingsRef = ref(database, `ratings/${doctorId}`);
        const avgRef = ref(database, `doctorStats/${doctorId}/averageRating`);
        
        try {
            const [ratingsSnapshot, avgSnapshot] = await Promise.all([
                get(ratingsRef),
                get(avgRef)
            ]);
            
            const reviews = [];
            if (ratingsSnapshot.exists()) {
                ratingsSnapshot.forEach(child => {
                    reviews.push({
                        id: child.key,
                        ...child.val()
                    });
                });
            }
            
            const averageRating = avgSnapshot.val() || 0;
            const totalRatings = reviews.length;
            
            // تحقق من تقييم المستخدم الحالي
            if (currentUser) {
                const userRating = reviews.find(r => r.userId === currentUser.uid);
                if (userRating) {
                    userRatings[doctorId] = {
                        rating: userRating.rating,
                        review: userRating.review
                    };
                }
            }
            
            return {
                averageRating,
                totalRatings,
                reviews: reviews.sort((a, b) => b.timestamp - a.timestamp).slice(0, 5) // آخر 5 تقييمات
            };
        } catch (error) {
            console.error('خطأ في تحميل التقييمات:', error);
            return { averageRating: 0, totalRatings: 0, reviews: [] };
        }
    }

    // ==================== تحديث واجهة المستخدم ====================
    async function updateDoctorCardUI(doctorId) {
        const card = document.querySelector(`[data-doctor-id="${doctorId}"]`);
        if (!card) return;
        
        const [likesData, ratingsData] = await Promise.all([
            loadLikesData(doctorId),
            loadRatingsData(doctorId)
        ]);
        
        // تحديث زر القلب
        const heartBtn = card.querySelector('.heart-btn');
        const likesCount = card.querySelector('.likes-count');
        
        if (heartBtn && likesCount) {
            if (likesData.liked) {
                heartBtn.classList.add('liked');
            } else {
                heartBtn.classList.remove('liked');
            }
            likesCount.textContent = likesData.count;
        }
        
        // تحديث النجوم
        const starsContainer = card.querySelector('.stars-container');
        const ratingNumber = card.querySelector('.rating-number');
        const ratingCount = card.querySelector('.rating-count');
        
        if (starsContainer && ratingNumber && ratingCount) {
            updateStarsDisplay(starsContainer, ratingsData.averageRating);
            ratingNumber.textContent = ratingsData.averageRating.toFixed(1);
            ratingCount.textContent = `(${ratingsData.totalRatings})`;
        }
        
        // تحديث المراجعات
        const reviewsList = card.querySelector('.reviews-list');
        if (reviewsList) {
            updateReviewsDisplay(reviewsList, ratingsData.reviews);
        }
    }

    function updateStarsDisplay(container, rating) {
        const fullStars = Math.floor(rating);
        const hasHalfStar = rating - fullStars >= 0.5;
        
        container.innerHTML = '';
        
        for (let i = 0; i < 5; i++) {
            const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            star.setAttribute("viewBox", "0 0 24 24");
            star.classList.add("star");
            
            const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            polygon.setAttribute("points", "12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2");
            
            if (i < fullStars) {
                polygon.classList.add("filled");
                star.classList.add("filled");
            } else if (i === fullStars && hasHalfStar) {
                polygon.setAttribute("fill", "url(#halfGradient)");
                star.classList.add("filled");
            } else {
                polygon.classList.add("empty");
                star.classList.add("empty");
            }
            
            star.appendChild(polygon);
            container.appendChild(star);
        }
    }

    function updateReviewsDisplay(container, reviews) {
        if (reviews.length === 0) {
            container.innerHTML = '<p style="color: var(--text-tertiary); font-size: 0.85rem;">لا توجد تقييمات بعد</p>';
            return;
        }
        
        container.innerHTML = reviews.map(review => `
            <div class="review-item">
                <div class="review-header">
                    <div class="reviewer-avatar">${(review.userName || 'م').charAt(0)}</div>
                    <span class="reviewer-name">${review.userName || 'مستخدم'}</span>
                    <span class="review-date">${formatDate(review.timestamp)}</span>
                </div>
                <div class="review-rating">
                    ${Array.from({length: 5}, (_, i) => `
                        <svg class="review-star ${i < review.rating ? 'filled' : 'empty'}" viewBox="0 0 24 24">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    `).join('')}
                </div>
                ${review.review ? `<p class="review-text">${review.review}</p>` : ''}
            </div>
        `).join('');
    }

    function formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'الآن';
        if (diff < 3600000) return `${Math.floor(diff / 60000)} دقيقة`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)} ساعة`;
        if (diff < 604800000) return `${Math.floor(diff / 86400000)} يوم`;
        
        return date.toLocaleDateString('ar-SA');
    }

    // خنق (throttle) للبحث
    let renderScheduled = false;
    function scheduleRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(async () => {
            await performRender();
            renderScheduled = false;
        });
    }

    // تنفيذ عرض البطاقات
    async function performRender() {
        const query = searchQuery.toLowerCase().trim();
        const filtered = allDoctors.filter(doc => {
            if (filterSpecialty !== 'all' && doc.specialty !== filterSpecialty) return false;
            if (!query) return true;
            return (doc.name || '').toLowerCase().includes(query) ||
                   getSpecialtyName(doc.specialty).includes(query);
        });

        if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        grid.innerHTML = '';
        
        // إنشاء البطاقات بشكل متزامن أولاً
        for (const doc of filtered) {
            const card = createDoctorCard(doc);
            grid.appendChild(card);
        }
        
        // تحميل بيانات التفاعلات بشكل غير متزامن
        for (const doc of filtered) {
            updateDoctorCardUI(doc.id);
        }
    }

    // إنشاء بطاقة طبيب
    function createDoctorCard(doc) {
        const card = document.createElement('div');
        card.className = 'doctor-card';
        card.dataset.doctorId = doc.id;
        
        const avatarHtml = doc.photoURL
            ? `<div class="avatar-wrapper"><img src="${escapeAttr(doc.photoURL)}" alt="${escapeAttr(doc.name)}" class="avatar-img" loading="lazy"></div>`
            : `<div class="avatar-wrapper">${(doc.name || 'د').charAt(0).toUpperCase()}</div>`;
        
        const specLabel = getSpecialtyName(doc.specialty);
        const bio = (doc.quickBlurb || '').substring(0, 120);
        
        card.innerHTML = `
            <div class="card-header">
                ${avatarHtml}
                <div class="doctor-info">
                    <div class="doctor-name">${escapeHtml(doc.name || '—')}</div>
                    <div class="specialty-badge">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="8" r="4"></circle><path d="M5 20v-2a7 7 0 0 1 14 0v2"></path>
                        </svg>
                        ${escapeHtml(specLabel)}
                    </div>
                    <div class="doctor-bio">${escapeHtml(bio)}${bio.length > 100 ? '...' : ''}</div>
                </div>
            </div>
            
            <!-- شريط التفاعلات -->
            <div class="interactions-bar">
                <button class="heart-btn" data-action="like" data-doctor-id="${escapeAttr(doc.id)}">
                    <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span class="likes-count">0</span>
                </button>
                
                <div class="rating-display">
                    <div class="stars-container">
                        ${Array.from({length: 5}, () => `
                            <svg class="star empty" viewBox="0 0 24 24">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        `).join('')}
                    </div>
                    <span class="rating-number">0.0</span>
                    <span class="rating-count">(0)</span>
                </div>
            </div>
            
            <!-- قسم التقييمات -->
            <div class="reviews-section">
                <div class="reviews-header">
                    <span class="reviews-title">تقييمات المرضى</span>
                    <button class="add-review-btn" data-action="add-review" data-doctor-id="${escapeAttr(doc.id)}">أضف تقييمك</button>
                </div>
                
                <!-- نموذج إضافة تقييم -->
                <div class="review-form" id="reviewForm-${escapeAttr(doc.id)}">
                    <div class="star-rating-input" data-doctor-id="${escapeAttr(doc.id)}">
                        ${Array.from({length: 5}, (_, i) => `
                            <svg class="star empty" viewBox="0 0 24 24" data-rating="${i + 1}">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        `).join('')}
                    </div>
                    <textarea class="review-textarea" placeholder="اكتب تقييمك (اختياري)..."></textarea>
                    <button class="review-submit" data-action="submit-review" data-doctor-id="${escapeAttr(doc.id)}">إرسال التقييم</button>
                </div>
                
                <div class="reviews-list">
                    <p style="color: var(--text-tertiary); font-size: 0.85rem;">جاري تحميل التقييمات...</p>
                </div>
            </div>
            
            <button class="action-button" data-action="chat" data-doctor-id="${escapeAttr(doc.authUid || doc.id)}" data-patient-id="${escapeAttr(currentUser?.uid || '')}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                راسل الآن
            </button>
        `;
        
        return card;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }
    function escapeAttr(text) {
        return String(text).replace(/"/g, '&quot;');
    }

    // بناء قائمة التخصصات
    function buildFilterDropdown() {
        const specs = [...new Set(allDoctors.map(d => d.specialty).filter(Boolean))];
        const items = ['all', ...specs];
        
        filterDropdown.innerHTML = '';
        items.forEach(spec => {
            const div = document.createElement('div');
            div.className = 'filter-option' + (filterSpecialty === spec ? ' active' : '');
            div.dataset.spec = spec;
            div.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    ${spec === 'all' 
                        ? '<circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path>'
                        : '<polyline points="20 6 9 17 4 12"></polyline>'}
                </svg>
                ${spec === 'all' ? 'كل التخصصات' : getSpecialtyName(spec)}
            `;
            filterDropdown.appendChild(div);
        });
    }

    // ==================== المزامنة مع Firebase ====================
    function startRealtimeSync() {
        const doctorsRef = ref(database, 'doctors');
        
        onValue(doctorsRef, async (snapshot) => {
            setSyncStatus('syncing', 'جاري تحديث البيانات...');
            
            const fresh = [];
            snapshot.forEach(child => {
                const data = child.val();
                if (data.status !== 'blocked') {
                    fresh.push({
                        id: child.key,
                        authUid: data.authUid || child.key,
                        name: data.name || '',
                        specialty: data.specialty || '',
                        quickBlurb: data.quickBlurb || '',
                        photoURL: data.photoURL || '',
                        email: data.email || '',
                        phone: data.phone || '',
                        status: data.status || 'active'
                    });
                }
            });
            
            // تحديث الكاش والذاكرة
            cache.save(fresh);
            allDoctors = fresh;
            
            buildFilterDropdown();
            await performRender();
            setSyncStatus('online', 'بيانات محدثة ✓');
        }, (error) => {
            console.warn('خطأ في المزامنة:', error);
            setSyncStatus('syncing', 'غير متصل - عرض البيانات المخزنة');
        });
    }

    // ==================== التهيئة ====================
    async function initialize() {
        // تحميل البيانات المخزنة فوراً
        const cached = await cache.load();
        if (cached.length) {
            allDoctors = cached;
            buildFilterDropdown();
            await performRender();
            setSyncStatus('online', 'تم التحميل من الذاكرة المحلية');
        } else {
            setSyncStatus('syncing', 'تحميل أول مرة...');
        }
        
        startRealtimeSync();
    }

    // ==================== إعداد الأحداث ====================
    function setupListeners() {
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            scheduleRender();
        });
        
        filterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            filterDropdown.classList.toggle('show');
            filterBtn.classList.toggle('active');
        });
        
        document.addEventListener('click', () => {
            filterDropdown.classList.remove('show');
            filterBtn.classList.remove('active');
        });
        
        filterDropdown.addEventListener('click', (e) => {
            const option = e.target.closest('.filter-option');
            if (!option) return;
            filterSpecialty = option.dataset.spec;
            filterLabel.textContent = filterSpecialty === 'all' ? 'كل التخصصات' : getSpecialtyName(filterSpecialty);
            buildFilterDropdown();
            scheduleRender();
            filterDropdown.classList.remove('show');
            filterBtn.classList.remove('active');
        });
        
        // التعامل مع جميع الأحداث في grid
        grid.addEventListener('click', async (e) => {
            // زر الإعجاب
            const heartBtn = e.target.closest('[data-action="like"]');
            if (heartBtn) {
                const doctorId = heartBtn.dataset.doctorId;
                await toggleLike(doctorId);
                return;
            }
            
            // زر المحادثة
            const chatBtn = e.target.closest('[data-action="chat"]');
            if (chatBtn) {
                const doctorId = chatBtn.dataset.doctorId;
                const patientId = chatBtn.dataset.patientId;
                window.location.href = `conversation.html?doctorId=${encodeURIComponent(doctorId)}&patientId=${encodeURIComponent(patientId)}`;
                return;
            }
            
            // زر إضافة تقييم
            const addReviewBtn = e.target.closest('[data-action="add-review"]');
            if (addReviewBtn) {
                const doctorId = addReviewBtn.dataset.doctorId;
                const form = document.getElementById(`reviewForm-${doctorId}`);
                if (form) {
                    form.classList.toggle('show');
                }
                return;
            }
            
            // نجوم التقييم
            const star = e.target.closest('.star-rating-input .star');
            if (star) {
                const rating = parseInt(star.dataset.rating);
                const container = star.closest('.star-rating-input');
                const doctorId = container.dataset.doctorId;
                
                // تحديث عرض النجوم
                const stars = container.querySelectorAll('.star');
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.classList.add('filled');
                        s.classList.remove('empty');
                    } else {
                        s.classList.remove('filled');
                        s.classList.add('empty');
                    }
                });
                
                // تخزين التقييم المختار
                container.dataset.selectedRating = rating;
                return;
            }
            
            // زر إرسال التقييم
            const submitBtn = e.target.closest('[data-action="submit-review"]');
            if (submitBtn) {
                const doctorId = submitBtn.dataset.doctorId;
                const form = document.getElementById(`reviewForm-${doctorId}`);
                const starContainer = form.querySelector('.star-rating-input');
                const textarea = form.querySelector('.review-textarea');
                
                const selectedRating = parseInt(starContainer.dataset.selectedRating || '0');
                
                if (selectedRating === 0) {
                    alert('الرجاء اختيار تقييم بالنجوم');
                    return;
                }
                
                const reviewText = textarea.value.trim();
                const success = await submitRating(doctorId, selectedRating, reviewText);
                
                if (success) {
                    form.classList.remove('show');
                    textarea.value = '';
                    starContainer.dataset.selectedRating = '0';
                    
                    // إعادة تعيين النجوم
                    const stars = starContainer.querySelectorAll('.star');
                    stars.forEach(s => {
                        s.classList.remove('filled');
                        s.classList.add('empty');
                    });
                }
                return;
            }
        });
    }

    // ==================== بدء التشغيل ====================
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            setupListeners();
            initialize();
        } else {
            window.location.href = 'patient-login.html';
        }
    });

    // دعم الأجهزة القديمة
    if (!CSS.supports('backdrop-filter', 'blur(10px)')) {
        document.documentElement.style.setProperty('--surface', 'rgba(255, 255, 255, 0.98)');
    }
</script>
