<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>سُكُون · محادثة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #f0f4f4;
            --bg-chat: #e8edee;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-solid: #ffffff;
            --primary-50: #e6f3f3;
            --primary-100: #cce7e7;
            --primary-200: #99cfcf;
            --primary-300: #66b8b8;
            --primary-400: #3da0a0;
            --primary-500: #2a8888;
            --primary-600: #1f6f6f;
            --primary-700: #165656;
            --primary-800: #0d3d3d;
            --primary-900: #062424;
            
            --msg-outgoing: #d4f0f0;
            --msg-incoming: #ffffff;
            --msg-system: #e8f0f0;
            
            --text-primary: #1a2e2e;
            --text-secondary: #3d5a5a;
            --text-tertiary: #8ba5a5;
            --text-meta: #9ab5b5;
            
            --danger: #d94f4f;
            --success: #2ecc71;
            --warning: #f4b740;
            --read-color: #4fc3f7;
            
            --shadow-xs: 0 1px 3px rgba(22, 86, 86, 0.06);
            --shadow-sm: 0 2px 8px rgba(22, 86, 86, 0.08);
            --shadow-md: 0 4px 16px rgba(22, 86, 86, 0.12);
            --shadow-lg: 0 8px 32px rgba(22, 86, 86, 0.16);
            --shadow-focus: 0 0 0 3px rgba(42, 136, 136, 0.15);
            
            --radius-msg: 20px;
            --radius-element: 18px;
            --radius-full: 9999px;
            
            --transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0a1515;
                --bg-chat: #0d1a1a;
                --surface: rgba(22, 36, 36, 0.92);
                --surface-solid: #162424;
                --msg-outgoing: #1a3a3a;
                --msg-incoming: #1e3030;
                --msg-system: #152828;
                --text-primary: #e3f0f0;
                --text-secondary: #b3d1d1;
                --text-tertiary: #7aa3a3;
                --text-meta: #6b8a8a;
                --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
                --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
                color-scheme: dark;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { font-size:16px; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
        body {
            font-family:'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--bg-primary);
            color:var(--text-primary);
            height:100dvh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            position:relative;
            transition:background 0.2s;
        }

        /* ───── Header ───── */
        .chat-header {
            display:flex;
            align-items:center;
            gap:14px;
            padding:12px 16px;
            background:var(--surface);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border-bottom:1px solid rgba(0,0,0,0.06);
            box-shadow:var(--shadow-xs);
            z-index:100;
            flex-shrink:0;
            min-height:72px;
        }
        .back-btn {
            width:42px; height:42px; border-radius:50%;
            border:1.5px solid rgba(0,0,0,0.08);
            background:transparent;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; color:var(--text-secondary);
            transition:var(--transition); flex-shrink:0;
        }
        .back-btn:active { transform:scale(0.92); background:var(--primary-50); }
        
        .avatar-wrapper {
            width:46px; height:46px; border-radius:50%;
            background:linear-gradient(135deg, var(--primary-500), var(--primary-700));
            box-shadow:0 2px 8px rgba(31, 111, 111, 0.2);
            border:2px solid var(--surface-solid);
            overflow:hidden; display:flex; align-items:center;
            justify-content:center; font-size:1.2rem;
            font-weight:800; color:white; flex-shrink:0;
        }
        .avatar-img { width:100%; height:100%; object-fit:cover; display:block; }
        
        .header-info { flex:1; min-width:0; }
        .doctor-name {
            font-size:1.05rem; font-weight:700; color:var(--text-primary);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            line-height:1.2;
        }
        .header-subtitle {
            font-size:0.72rem; color:var(--text-tertiary);
            display:flex; align-items:center; gap:5px;
            margin-top:1px;
        }
        .online-dot {
            width:8px; height:8px; border-radius:50%;
            background:var(--success); display:inline-block;
            animation:pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity:1; }
            50% { opacity:0.5; }
        }

        /* ───── Messages Container ───── */
        .messages-container {
            flex:1;
            overflow-y:auto;
            padding:12px 12px 8px;
            display:flex;
            flex-direction:column;
            gap:3px;
            position:relative;
            z-index:2;
            overscroll-behavior:contain;
            background:var(--bg-chat);
            background-image:
                radial-gradient(circle at 20% 80%, rgba(42,136,136,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(42,136,136,0.02) 0%, transparent 50%);
        }
        .messages-container::-webkit-scrollbar { width:3px; }
        .messages-container::-webkit-scrollbar-thumb {
            background:rgba(0,0,0,0.1); border-radius:10px;
        }
        .messages-container::-webkit-scrollbar-track { background:transparent; }

        /* ───── Date Separator ───── */
        .date-separator {
            display:flex; justify-content:center;
            margin:18px 0 12px;
            position:relative;
            z-index:1;
        }
        .date-badge {
            background:var(--surface);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            padding:8px 20px;
            border-radius:40px;
            font-size:0.75rem;
            font-weight:700;
            color:var(--text-secondary);
            border:1px solid rgba(0,0,0,0.06);
            box-shadow:var(--shadow-xs);
            letter-spacing:0.02em;
        }

        /* ───── System Message ───── */
        .system-message {
            text-align:center;
            margin:10px 0;
            animation:messageAppear 0.25s ease-out;
        }
        .system-badge {
            display:inline-flex;
            align-items:center;
            gap:8px;
            background:var(--msg-system);
            padding:8px 18px;
            border-radius:40px;
            font-size:0.78rem;
            font-weight:600;
            color:var(--text-secondary);
            border:1px solid rgba(0,0,0,0.05);
            box-shadow:var(--shadow-xs);
        }
        .system-badge svg {
            width:16px; height:16px;
            color:var(--primary-500);
        }

        /* ───── Message Row ───── */
        .message-row {
            display:flex;
            margin-bottom:3px;
            animation:messageAppear 0.3s cubic-bezier(0.2, 0, 0, 1);
            position:relative;
        }
        @keyframes messageAppear {
            from { opacity:0; transform:translateY(12px) scale(0.96); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        
        .message-row.outgoing {
            justify-content:flex-end;
            padding-left:10%;
        }
        .message-row.incoming {
            justify-content:flex-start;
            padding-right:10%;
        }
        
        .message-bubble {
            max-width:85%;
            position:relative;
            transition:transform 0.15s;
        }
        .message-bubble:active {
            transform:scale(0.98);
        }
        
        /* Outgoing (Patient) */
        .message-row.outgoing .message-bubble {
            background:var(--msg-outgoing);
            color:var(--text-primary);
            border-radius:20px 4px 20px 20px;
            box-shadow:var(--shadow-xs);
            border:1px solid rgba(42,136,136,0.12);
        }
        
        /* Incoming (Doctor) */
        .message-row.incoming .message-bubble {
            background:var(--msg-incoming);
            color:var(--text-primary);
            border-radius:4px 20px 20px 20px;
            box-shadow:var(--shadow-sm);
            border:1px solid rgba(0,0,0,0.06);
        }
        
        .message-content {
            padding:10px 16px;
            font-size:0.93rem;
            line-height:1.65;
            word-break:break-word;
            white-space:pre-wrap;
        }
        
        /* ───── Message Footer (Time + Status) ───── */
        .message-footer {
            display:flex;
            align-items:center;
            justify-content:flex-end;
            gap:4px;
            padding:0px 14px 8px;
            font-size:0.68rem;
            color:var(--text-meta);
            min-height:18px;
        }
        .message-time {
            font-weight:500;
            letter-spacing:0.03em;
            white-space:nowrap;
        }
        .message-status {
            display:flex;
            align-items:center;
            gap:2px;
        }
        .status-icon {
            width:16px;
            height:16px;
        }
        .status-sent { color:var(--text-meta); }
        .status-delivered { color:var(--text-meta); }
        .status-read { color:var(--read-color); }
        
        /* ───── Grouped Messages ───── */
        .message-row.grouped {
            margin-top:-1px;
        }
        .message-row.grouped .message-bubble {
            border-radius:6px 20px 20px 6px;
        }
        .message-row.outgoing.grouped .message-bubble {
            border-radius:20px 6px 6px 20px;
        }
        .message-row.incoming.grouped .message-bubble {
            border-radius:6px 20px 20px 6px;
        }
        .message-row.grouped .message-footer {
            display:none;
        }

        /* ───── Empty & Loading ───── */
        .loading-state, .empty-state {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:60px 20px;
            text-align:center;
            color:var(--text-tertiary);
            height:100%;
        }
        .spinner {
            width:40px; height:40px;
            border:3px solid var(--primary-100);
            border-top-color:var(--primary-500);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            margin-bottom:20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        
        .empty-icon {
            font-size:4rem;
            margin-bottom:16px;
            opacity:0.6;
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform:translateY(0); }
            50% { transform:translateY(-10px); }
        }
        .empty-title {
            font-size:1.2rem;
            font-weight:700;
            color:var(--text-secondary);
            margin-bottom:6px;
        }
        .empty-subtitle {
            font-size:0.9rem;
            color:var(--text-tertiary);
            max-width:280px;
        }

        /* ───── Input Bar ───── */
        .input-bar {
            display:flex;
            align-items:flex-end;
            gap:10px;
            padding:10px 14px 14px;
            background:var(--surface);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border-top:1px solid rgba(0,0,0,0.06);
            flex-shrink:0;
            z-index:100;
        }
        .input-wrapper {
            flex:1;
            position:relative;
            background:var(--bg-primary);
            border-radius:28px;
            border:1.5px solid rgba(0,0,0,0.08);
            transition:var(--transition);
            display:flex;
            align-items:flex-end;
        }
        .input-wrapper:focus-within {
            border-color:var(--primary-400);
            box-shadow:0 0 0 3px rgba(42,136,136,0.1);
            background:var(--surface-solid);
        }
        .message-input {
            width:100%;
            min-height:44px;
            max-height:120px;
            padding:10px 16px;
            background:transparent;
            border:none;
            font-family:'Cairo', sans-serif;
            font-size:0.95rem;
            color:var(--text-primary);
            outline:none;
            resize:none;
            line-height:1.5;
        }
        .message-input::placeholder { color:var(--text-tertiary); opacity:0.7; }
        
        .send-button {
            width:44px;
            height:44px;
            border-radius:50%;
            border:none;
            background:linear-gradient(145deg, var(--primary-600), var(--primary-500));
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(42,136,136,0.3);
            transition:all 0.2s cubic-bezier(0.2, 0, 0, 1);
            flex-shrink:0;
            position:relative;
            overflow:hidden;
        }
        .send-button::after {
            content:'';
            position:absolute;
            inset:0;
            background:rgba(255,255,255,0.2);
            opacity:0;
            transition:opacity 0.2s;
            border-radius:50%;
        }
        .send-button:active {
            transform:scale(0.9);
            box-shadow:0 2px 8px rgba(42,136,136,0.4);
        }
        .send-button:active::after { opacity:1; }
        .send-button.sending {
            opacity:0.6;
            pointer-events:none;
            animation:sending-pulse 1s infinite;
        }
        @keyframes sending-pulse {
            0%, 100% { opacity:0.6; }
            50% { opacity:0.4; }
        }
        .send-button svg {
            width:20px;
            height:20px;
            transition:transform 0.2s;
        }
        .send-button:active svg {
            transform:rotate(-15deg) scale(1.1);
        }

        /* ───── Message Options Menu ───── */
        .message-options-overlay {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.3);
            z-index:500;
            display:none;
            backdrop-filter:blur(2px);
        }
        .message-options-overlay.show { display:block; }
        
        .message-options-menu {
            position:fixed;
            background:var(--surface-solid);
            border-radius:20px;
            box-shadow:var(--shadow-lg);
            padding:6px;
            z-index:501;
            display:none;
            border:1px solid rgba(0,0,0,0.08);
            min-width:180px;
            backdrop-filter:blur(20px);
            animation:menuPop 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        @keyframes menuPop {
            from { opacity:0; transform:scale(0.9); }
            to { opacity:1; transform:scale(1); }
        }
        .message-options-menu.show { display:block; }
        
        .msg-option {
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 16px;
            border-radius:14px;
            font-size:0.9rem;
            font-weight:600;
            color:var(--text-secondary);
            cursor:pointer;
            white-space:nowrap;
            transition:background 0.15s;
        }
        .msg-option:hover { background:var(--primary-50); }
        .msg-option.danger { color:var(--danger); }
        .msg-option.danger:hover { background:rgba(217,79,79,0.08); }

        /* ───── Toast ───── */
        .toast {
            position:fixed;
            bottom:100px;
            left:50%;
            transform:translateX(-50%) translateY(20px);
            background:var(--primary-800);
            color:white;
            padding:10px 24px;
            border-radius:40px;
            font-size:0.88rem;
            font-weight:600;
            z-index:9999;
            opacity:0;
            pointer-events:none;
            transition:all 0.3s cubic-bezier(0.2, 0, 0, 1);
            white-space:nowrap;
            box-shadow:var(--shadow-lg);
            letter-spacing:0.02em;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.error { background:var(--danger); }

        .icon { width:22px; height:22px; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; }

        @media (max-width:480px) {
            .chat-header { padding:10px 12px; gap:10px; min-height:64px; }
            .avatar-wrapper { width:40px; height:40px; }
            .doctor-name { font-size:0.95rem; }
            .message-bubble { max-width:90%; }
            .message-content { padding:8px 14px; font-size:0.9rem; }
            .message-row.outgoing { padding-left:8%; }
            .message-row.incoming { padding-right:8%; }
            .input-bar { padding:8px 10px 12px; gap:8px; }
            .send-button { width:40px; height:40px; }
        }
    </style>
</head>
<body>

<header class="chat-header">
    <button class="back-btn" id="backBtn" aria-label="رجوع">
        <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </button>
    <div class="avatar-wrapper" id="doctorAvatar">د</div>
    <div class="header-info">
        <div class="doctor-name" id="doctorName">جاري التحميل...</div>
        <div class="header-subtitle">
            <span class="online-dot"></span>
            <span>متصل الآن</span>
        </div>
    </div>
</header>

<main class="messages-container" id="messagesContainer">
    <div class="loading-state">
        <div class="spinner"></div>
        <div style="font-weight:600">جاري تحميل المحادثة...</div>
    </div>
</main>

<footer class="input-bar">
    <div class="input-wrapper">
        <textarea class="message-input" id="messageInput" placeholder="اكتب رسالتك..." rows="1"></textarea>
    </div>
    <button class="send-button" id="sendButton" aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
    </button>
</footer>

<div class="message-options-overlay" id="messageOptionsOverlay"></div>
<div class="message-options-menu" id="messageOptionsMenu">
    <div class="msg-option" id="editMessageOption">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"></path>
        </svg>
        <span>تعديل الرسالة</span>
    </div>
    <div class="msg-option danger" id="deleteMessageOption">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>حذف الرسالة</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { firebaseConfig } from './firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, get, remove } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // ==================== أدوات التشفير ====================
    const ENCRYPTION_SALT = new Uint8Array([22, 86, 136, 136, 42, 136, 136, 42]).buffer;
    const ENCRYPTION_ITERATIONS = 100000;

    async function deriveEncryptionKey(patientId, doctorId) {
        const ids = [patientId, doctorId].sort();
        const baseString = `${ids[0]}:${ids[1]}`;
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(baseString), { name: 'PBKDF2' }, false, ['deriveKey']);
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ENCRYPTION_SALT, iterations: ENCRYPTION_ITERATIONS, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    async function encryptMessage(plainText, key) {
        const enc = new TextEncoder();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plainText));
        const combined = new Uint8Array(iv.length + encrypted.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(encrypted), iv.length);
        return btoa(String.fromCharCode(...combined));
    }

    async function decryptMessage(encryptedBase64, key) {
        try {
            const combined = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
            const iv = combined.slice(0, 12);
            const data = combined.slice(12);
            const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            return '[رسالة مشفرة - تعذر فك التشفير]';
        }
    }

    // ==================== IndexedDB ====================
    class MessageCache {
        constructor() { this.db = null; }
        async init() {
            if (this.db) return;
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('SakoonMessagesDB', 2);
                req.onerror = () => reject(req.error);
                req.onsuccess = () => { this.db = req.result; resolve(); };
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('messages')) db.createObjectStore('messages', { keyPath: 'convId' });
                    if (!db.objectStoreNames.contains('doctors')) db.createObjectStore('doctors', { keyPath: 'id' });
                };
            });
        }
        async getMessages(convId) {
            await this.init();
            return new Promise((resolve) => {
                const tx = this.db.transaction('messages', 'readonly');
                const req = tx.objectStore('messages').get(convId);
                req.onsuccess = () => resolve(req.result?.messages || []);
                req.onerror = () => resolve([]);
            });
        }
        async saveMessages(convId, messages) {
            await this.init();
            return new Promise((resolve) => {
                const tx = this.db.transaction('messages', 'readwrite');
                tx.objectStore('messages').put({ convId, messages });
                tx.oncomplete = () => resolve();
            });
        }
        async getDoctor(id) {
            await this.init();
            return new Promise((resolve) => {
                const tx = this.db.transaction('doctors', 'readonly');
                const req = tx.objectStore('doctors').get(id);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }
        async saveDoctor(doctor) {
            await this.init();
            return new Promise((resolve) => {
                const tx = this.db.transaction('doctors', 'readwrite');
                tx.objectStore('doctors').put(doctor);
                tx.oncomplete = () => resolve();
            });
        }
    }

    const cache = new MessageCache();

    // ==================== دوال مساعدة ====================
    const toast = (msg, err = false) => {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `toast show ${err ? 'error' : ''}`;
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => el.classList.remove('show'), 3000);
    };

    const formatTime = (timestamp) => {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const period = hours >= 12 ? 'م' : 'ص';
        const displayHours = hours % 12 || 12;
        return `${displayHours}:${minutes} ${period}`;
    };

    const formatDateLabel = (timestamp) => {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diffDays = Math.floor((today - msgDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) return 'اليوم';
        if (diffDays === 1) return 'أمس';
        if (diffDays < 7) {
            return date.toLocaleDateString('ar-EG', { weekday: 'long' });
        }
        if (date.getFullYear() === now.getFullYear()) {
            return date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' });
        }
        return date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    const escapeHtml = (text) => {
        if (!text) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    };

    // ==================== الحالة العامة ====================
    let currentUserId = null;
    let doctorId = null;
    let conversationId = null;
    let encryptionKey = null;
    let allMessages = [];
    let isNearBottom = true;
    let longPressTimer = null;
    let currentSelectedMsg = null;

    const menu = document.getElementById('messageOptionsMenu');
    const overlay = document.getElementById('messageOptionsOverlay');
    const container = document.getElementById('messagesContainer');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendButton');
    const doctorNameEl = document.getElementById('doctorName');
    const doctorAvatarEl = document.getElementById('doctorAvatar');

    container.addEventListener('scroll', () => {
        const { scrollTop, scrollHeight, clientHeight } = container;
        isNearBottom = scrollHeight - scrollTop - clientHeight < 100;
    });

    const scrollToBottom = (force = false) => {
        if (force || isNearBottom) {
            requestAnimationFrame(() => {
                container.scrollTo({
                    top: container.scrollHeight,
                    behavior: force ? 'auto' : 'smooth'
                });
            });
        }
    };

    // ==================== عرض الرسائل ====================
    const renderMessages = async (msgs) => {
        const fragment = document.createDocumentFragment();
        let lastDate = '';
        let lastSenderId = '';
        const sorted = [...msgs].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

        for (let i = 0; i < sorted.length; i++) {
            const msg = sorted[i];
            const nextMsg = sorted[i + 1];

            // رسائل النظام
            if (msg.type === 'system') {
                const sysDiv = document.createElement('div');
                sysDiv.className = 'system-message';
                sysDiv.innerHTML = `
                    <div class="system-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        ${escapeHtml(msg.text)}
                    </div>`;
                fragment.appendChild(sysDiv);
                lastSenderId = '';
                continue;
            }

            const dateLabel = formatDateLabel(msg.timestamp);
            if (dateLabel && dateLabel !== lastDate) {
                lastDate = dateLabel;
                const sep = document.createElement('div');
                sep.className = 'date-separator';
                sep.innerHTML = `<div class="date-badge">${dateLabel}</div>`;
                fragment.appendChild(sep);
                lastSenderId = '';
            }

            const isOutgoing = msg.senderId === currentUserId;
            const rowClass = isOutgoing ? 'outgoing' : 'incoming';
            const timeStr = formatTime(msg.timestamp);

            // تحديد ما إذا كانت الرسالة مجمعة (نفس المرسل خلال دقيقتين)
            const isGrouped = lastSenderId === msg.senderId &&
                nextMsg &&
                nextMsg.senderId === msg.senderId &&
                nextMsg.type !== 'system' &&
                (nextMsg.timestamp - msg.timestamp) < 120000;

            // فك التشفير
            let displayText = '';
            if (msg.encrypted && msg.encryptedText) {
                try {
                    displayText = await decryptMessage(msg.encryptedText, encryptionKey);
                } catch (e) {
                    displayText = '[تعذر فك التشفير]';
                }
            } else if (msg.text) {
                displayText = msg.text;
            }

            const row = document.createElement('div');
            row.className = `message-row ${rowClass}${isGrouped ? ' grouped' : ''}`;
            row.dataset.msgId = msg.id;
            row.dataset.messageText = displayText;
            row.dataset.timestamp = msg.timestamp;

            // حالة القراءة
            let statusIcon = '';
            if (isOutgoing && !isGrouped) {
                if (msg.read) {
                    statusIcon = `
                        <svg class="status-icon status-read" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <path d="M18 7l-8 8-4-4 1.5-1.5L10 12l6.5-6.5z"/>
                            <path d="M22 7l-8 8-4-4 1.5-1.5L10 12l6.5-6.5z" transform="translate(3,0)"/>
                        </svg>`;
                } else {
                    statusIcon = `
                        <svg class="status-icon status-sent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>`;
                }
            }

            row.innerHTML = `
                <div class="message-bubble">
                    <div class="message-content">${escapeHtml(displayText)}</div>
                    ${!isGrouped ? `
                        <div class="message-footer">
                            <span class="message-time">${timeStr}</span>
                            ${isOutgoing ? `<span class="message-status">${statusIcon}</span>` : ''}
                        </div>
                    ` : ''}
                </div>
            `;

            fragment.appendChild(row);
            lastSenderId = msg.senderId;
        }

        container.innerHTML = '';
        container.appendChild(fragment);

        if (sorted.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <div class="empty-title">لا توجد رسائل بعد</div>
                    <div class="empty-subtitle">ابدأ المحادثة مع طبيبك الآن</div>
                </div>`;
        }
    };

    // ==================== تحميل الطبيب ====================
    const loadDoctor = async () => {
        try {
            let doc = await cache.getDoctor(doctorId);
            if (doc) updateDoctorUI(doc);
            const snap = await get(ref(database, `doctors/${doctorId}`));
            if (snap.exists()) {
                const data = snap.val();
                doc = {
                    id: doctorId,
                    name: data.name || 'أخصائي نفسي',
                    photoURL: data.photoURL || '',
                    specialty: data.specialty || ''
                };
                await cache.saveDoctor(doc);
                updateDoctorUI(doc);
            }
        } catch (e) { console.warn('خطأ تحميل الطبيب:', e); }
    };

    const updateDoctorUI = (doc) => {
        doctorNameEl.textContent = doc.name || 'أخصائي نفسي';
        if (doc.photoURL) {
            doctorAvatarEl.innerHTML = `<img src="${doc.photoURL}" alt="${doc.name}" class="avatar-img">`;
        } else {
            doctorAvatarEl.textContent = (doc.name || 'د').charAt(0);
        }
    };

    // ==================== المحادثة ====================
    const getOrCreateConv = async () => {
        const refConv = ref(database, 'conversations');
        const snap = await get(refConv);
        if (snap.exists()) {
            const convs = snap.val();
            for (const id in convs) {
                if (convs[id].patientId === currentUserId && convs[id].doctorId === doctorId) {
                    conversationId = id;
                    return id;
                }
            }
        }
        const newRef = push(refConv);
        conversationId = newRef.key;
        await set(newRef, {
            patientId: currentUserId,
            doctorId: doctorId,
            createdAt: Date.now(),
            lastMessage: '',
            lastMessageTime: Date.now(),
            unreadPatient: false
        });
        return conversationId;
    };

    const listenToMessages = () => {
        if (!conversationId) return;
        const msgsRef = ref(database, `conversations/${conversationId}/messages`);

        cache.getMessages(conversationId).then(async (cached) => {
            if (cached.length) {
                allMessages = cached;
                await renderMessages(allMessages);
                scrollToBottom(true);
            }
        });

        onValue(msgsRef, async (snap) => {
            const fresh = [];
            if (snap.exists()) {
                snap.forEach(c => fresh.push({ id: c.key, ...c.val() }));
            }
            fresh.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            allMessages = fresh;
            await cache.saveMessages(conversationId, fresh);
            await renderMessages(allMessages);
            scrollToBottom();
        }, (err) => {
            console.warn('مزامنة:', err);
            toast('وضع غير متصل - عرض الرسائل المخزنة', true);
        });
    };

    // ==================== إرسال رسالة ====================
    let sending = false;
    const sendMessage = async (text) => {
        if (!text || !conversationId || sending || !encryptionKey) return;
        sending = true;
        sendBtn.classList.add('sending');

        try {
            const encryptedText = await encryptMessage(text, encryptionKey);
            const msgRef = push(ref(database, `conversations/${conversationId}/messages`));
            await set(msgRef, {
                encrypted: true,
                encryptedText: encryptedText,
                senderId: currentUserId,
                senderRole: 'patient',
                timestamp: Date.now(),
                read: false
            });
            await update(ref(database, `conversations/${conversationId}`), {
                lastMessage: text.substring(0, 50),
                lastMessageTime: Date.now(),
                unreadPatient: false
            });
            input.value = '';
            input.style.height = 'auto';
            scrollToBottom(true);
        } catch (e) {
            console.error('فشل الإرسال:', e);
            toast('فشل إرسال الرسالة', true);
        } finally {
            sending = false;
            sendBtn.classList.remove('sending');
            input.focus();
        }
    };

    // ==================== تعديل وحذف ====================
    const showMessageOptions = (msgId, x, y) => {
        currentSelectedMsg = msgId;
        const menuEl = menu;
        const menuWidth = 200;
        const menuHeight = 100;
        
        // تعديل الموضع ليكون داخل الشاشة
        let left = x;
        let top = y;
        
        if (left + menuWidth > window.innerWidth) {
            left = window.innerWidth - menuWidth - 10;
        }
        if (top + menuHeight > window.innerHeight) {
            top = y - menuHeight;
        }
        
        menuEl.style.left = left + 'px';
        menuEl.style.top = top + 'px';
        menuEl.classList.add('show');
        overlay.classList.add('show');
    };

    const hideMessageOptions = () => {
        menu.classList.remove('show');
        overlay.classList.remove('show');
        currentSelectedMsg = null;
    };

    const editMessage = async (msgId, newText) => {
        if (!encryptionKey) return;
        try {
            const encryptedText = await encryptMessage(newText, encryptionKey);
            await update(ref(database, `conversations/${conversationId}/messages/${msgId}`), {
                encrypted: true,
                encryptedText: encryptedText,
                text: null,
                edited: true,
                editTimestamp: Date.now()
            });
            toast('✓ تم تعديل الرسالة');
        } catch (e) {
            toast('فشل تعديل الرسالة', true);
        }
    };

    const deleteMessage = async (msgId) => {
        try {
            await remove(ref(database, `conversations/${conversationId}/messages/${msgId}`));
            toast('✓ تم حذف الرسالة');
        } catch (e) {
            toast('فشل حذف الرسالة', true);
        }
    };

    // ==================== أحداث المكالمات ====================
    const addCallLog = async (callData) => {
        const statusText = callData.status === 'answered' ? 'تم الرد' : 'لم يتم الرد';
        const typeText = callData.type === 'video' ? 'مكالمة فيديو 📹' : 'مكالمة صوتية 📞';
        const durationText = callData.duration
            ? ` • ${Math.floor(callData.duration / 60)}:${String(callData.duration % 60).padStart(2, '0')}`
            : '';
        const systemMsg = `${typeText} • ${statusText}${durationText}`;

        if (conversationId) {
            const msgRef = push(ref(database, `conversations/${conversationId}/messages`));
            await set(msgRef, {
                type: 'system',
                text: systemMsg,
                timestamp: callData.timestamp || Date.now()
            });
        }
    };

    window.addEventListener('callEvent', (e) => {
        if (e.detail && conversationId) {
            addCallLog(e.detail);
        }
    });

    // ==================== الأحداث ====================
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const txt = input.value.trim();
            if (txt) sendMessage(txt);
        }
    });

    sendBtn.addEventListener('click', () => {
        const txt = input.value.trim();
        if (txt) sendMessage(txt);
    });

    sendBtn.addEventListener('mousedown', (e) => e.preventDefault());

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'patient-chats.html';
    });

    // الضغط المطول للرسائل
    const startLongPress = (e, target) => {
        const row = target.closest('.message-row.outgoing');
        if (!row) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        longPressTimer = setTimeout(() => {
            showMessageOptions(row.dataset.msgId, clientX, clientY);
        }, 600);
    };

    const cancelLongPress = () => {
        clearTimeout(longPressTimer);
    };

    container.addEventListener('touchstart', (e) => startLongPress(e, e.target), { passive: true });
    container.addEventListener('touchend', cancelLongPress);
    container.addEventListener('touchmove', cancelLongPress);
    container.addEventListener('mousedown', (e) => {
        if (e.button === 0) startLongPress(e, e.target);
    });
    container.addEventListener('mouseup', cancelLongPress);
    container.addEventListener('mousemove', cancelLongPress);

    overlay.addEventListener('click', hideMessageOptions);

    document.getElementById('editMessageOption').addEventListener('click', () => {
        if (!currentSelectedMsg) return;
        const msg = allMessages.find(m => m.id === currentSelectedMsg);
        if (!msg) return;
        const currentText = msg.text || '';
        // محاولة الحصول على النص المشفر المخزن مؤقتاً
        const row = container.querySelector(`[data-msg-id="${currentSelectedMsg}"]`);
        const displayText = row ? row.dataset.messageText : currentText;
        
        const newText = prompt('تعديل الرسالة:', displayText);
        if (newText && newText.trim() && newText.trim() !== displayText) {
            editMessage(currentSelectedMsg, newText.trim());
        }
        hideMessageOptions();
    });

    document.getElementById('deleteMessageOption').addEventListener('click', () => {
        if (!currentSelectedMsg) return;
        if (confirm('هل أنت متأكد من حذف هذه الرسالة؟')) {
            deleteMessage(currentSelectedMsg);
        }
        hideMessageOptions();
    });

    // منع قائمة السياق الافتراضية على الرسائل
    container.addEventListener('contextmenu', (e) => {
        const row = e.target.closest('.message-row.outgoing');
        if (row) {
            e.preventDefault();
            showMessageOptions(row.dataset.msgId, e.clientX, e.clientY);
        }
    });

    // ==================== بدء التشغيل ====================
    const init = async (user) => {
        currentUserId = user.uid;
        doctorId = new URLSearchParams(window.location.search).get('doctorId');
        if (!doctorId) {
            toast('معرف الطبيب مفقود', true);
            return;
        }

        try {
            encryptionKey = await deriveEncryptionKey(currentUserId, doctorId);
        } catch (e) {
            toast('تعذر إعداد التشفير', true);
            return;
        }

        await loadDoctor();
        await getOrCreateConv();
        listenToMessages();

        // التركيز على حقل الإدخال
        setTimeout(() => input.focus(), 500);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) init(user);
        else window.location.href = 'patient-login.html';
    });

    // دعم الأجهزة القديمة
    if (!CSS.supports('backdrop-filter', 'blur(10px)')) {
        document.documentElement.style.setProperty('--surface', 'rgba(255, 255, 255, 0.98)');
    }
</script>
<script type="module" src="patient-call-listener.js"></script>
</body>
